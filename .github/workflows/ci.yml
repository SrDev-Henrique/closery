name: CI

on:
  pull_request:
  push:
    branches: [main]

# Só leitura: o workflow não publica nada nem comenta no PR.
permissions:
  contents: read

# Um push novo no mesmo PR/branch cancela a execução anterior.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  NEXT_TELEMETRY_DISABLED: "1"

jobs:
  checks:
    name: Tipos, lint e testes
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      # Ação de terceiro fixada por commit (v2.2.0).
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version: 1.3.3

      # A major do Node é a do engines.node ("22.x"); o Vitest 5 exige >= 22.12 (test/vercelConfig.test.ts amarra os dois).
      - uses: actions/setup-node@v7
        with:
          node-version: 22

      - name: Cache do Bun
        uses: actions/cache@v6
        with:
          path: ~/.bun/install/cache
          key: bun-${{ runner.os }}-${{ hashFiles('bun.lock') }}
          restore-keys: bun-${{ runner.os }}-

      - name: Instalar dependências
        run: bun install --frozen-lockfile

      - name: Tipos
        run: bun run check-types

      - name: Lint (Biome)
        run: bun run lint

      - name: Testes (Vitest + PGlite)
        run: bun run test

  e2e:
    name: E2E (Playwright)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version: 1.3.3

      - uses: actions/setup-node@v7
        with:
          node-version: 22

      - name: Cache do Bun
        uses: actions/cache@v6
        with:
          path: ~/.bun/install/cache
          key: bun-${{ runner.os }}-${{ hashFiles('bun.lock') }}
          restore-keys: bun-${{ runner.os }}-

      - name: Instalar dependências
        run: bun install --frozen-lockfile

      - name: Cache dos navegadores do Playwright
        uses: actions/cache@v6
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('bun.lock') }}

      # Com o cache, só instala as dependências do sistema.
      - name: Instalar Chromium
        run: bunx playwright install --with-deps chromium

      - name: Cache do build do Next
        uses: actions/cache@v6
        with:
          path: .next/cache
          key: next-${{ runner.os }}-${{ hashFiles('bun.lock') }}-${{ hashFiles('src/**', 'next.config.ts') }}
          restore-keys: next-${{ runner.os }}-${{ hashFiles('bun.lock') }}-

      # Sobe PGlite (pglite-socket) + next build + next start com o env do
      # playwright.config.ts: banco efêmero, nunca toca o Neon, sem segredo real.
      - name: E2E (inclui o next build)
        run: bun run test:e2e

      - name: Relatório do Playwright
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7
          if-no-files-found: ignore
